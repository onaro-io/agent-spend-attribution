name: Schema

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema matches SPEC.md
        run: npm run check:schema
      - name: Examples validate
        run: npm run validate
      - name: Published schema paths match the repo
        run: npm run check:published
